apply plugin: 'com.android.application'

def regressionApp = project.hasProperty('regressionApp')
if (regressionApp && gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }) {
    throw new GradleException('Regression configuration is debug-only')
}

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}
def releaseStoreFile = keystoreProperties['storeFile'] ?: System.getenv('ANDROID_KEYSTORE_PATH')
def hasReleaseSigning = releaseStoreFile != null && !releaseStoreFile.isBlank()

android {
    namespace = "ca.sekhrit.tms"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId regressionApp ? "ca.sekhrit.tms.regression" : "ca.sekhrit.tms"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode = (project.findProperty('ciVersionCode') ?: '41').toInteger()
        versionName = project.findProperty('ciVersionName') ?: "0.0.41"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasReleaseSigning) {
                keyAlias = keystoreProperties['keyAlias'] ?: System.getenv('ANDROID_KEY_ALIAS')
                keyPassword = keystoreProperties['keyPassword'] ?: System.getenv('ANDROID_KEY_PASSWORD')
                storeFile = file(releaseStoreFile)
                storePassword = keystoreProperties['storePassword'] ?: System.getenv('ANDROID_KEYSTORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}

if (regressionApp) {
    android.sourceSets.debug.assets.srcDir(layout.buildDirectory.dir('generated/regressionAssets'))
    def generateRegressionConfig = tasks.register('generateRegressionConfig') {
        def inputConfig = file('src/main/assets/capacitor.config.json')
        def outputConfig = layout.buildDirectory.file('generated/regressionAssets/capacitor.config.json')
        inputs.file(inputConfig)
        outputs.file(outputConfig)
        doLast {
            def config = new groovy.json.JsonSlurper().parse(inputConfig)
            config.server = (config.server ?: [:]) + [url: 'http://127.0.0.1:3100', cleartext: true, allowNavigation: ['127.0.0.1']]
            config.plugins = (config.plugins ?: [:]) + [TmsConnection: [localUrl: '', tailscaleUrl: '']]
            def target = outputConfig.get().asFile
            target.parentFile.mkdirs()
            target.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(config))
        }
    }
    tasks.configureEach { if (name == 'mergeDebugAssets') dependsOn(generateRegressionConfig) }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
